name: 🐞 Błąd / Bug
description: Coś nie działa albo działa inaczej, niż powinno. / Something doesn't work as it should.
title: 'Błąd: '
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Zgłoszenia są **publiczne** – nie wpisuj kwot, nazw kont ani innych prywatnych danych.
              Reports are **public** – don't include amounts, account names or other private details.
    - type: textarea
      id: what
      attributes:
          label: Co się stało? / What happened?
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Jak to powtórzyć? / How to make it happen again?
          value: |
              1.
              2.
    - type: textarea
      id: expected
      attributes:
          label: Co powinno się stać? / What should have happened?
    - type: input
      id: version
      attributes:
          label: Wersja aplikacji i telefonu / App and phone version
          description: Uzupełnia się samo przy zgłoszeniu z aplikacji (menu → Kontakt ze wsparciem). / Filled in automatically when reporting from the app.
          placeholder: Finance44 2.2.1 (26) · Android 15 (API 35) · Google Pixel 8 · pl
